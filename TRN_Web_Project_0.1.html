<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affinity Home Care | Training Center</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}
.header{background:#102a43;color:white;padding:28px 20px}
.header h1{margin:0;font-size:26px}
.header p{margin:6px 0 0;color:#d9e7f5}
.container{max-width:900px;margin:0 auto;padding:24px 16px}
.section-title{font-size:22px;margin:0 0 16px}
.card{background:white;border-radius:16px;box-shadow:0 4px 18px rgba(16,42,67,.10);overflow:hidden;margin-bottom:22px}
.video-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.card-body{padding:18px}
.badge{display:inline-block;background:#e7f0f8;color:#175a8a;font-weight:700;font-size:12px;padding:6px 10px;border-radius:999px;margin-bottom:9px}
.card h2{font-size:19px;margin:0;line-height:1.35}
.footer{text-align:center;padding:28px 16px;color:#6b7785;font-size:13px}
</style>
</head>
<body>
<header class="header">
  <h1>Affinity Home Care</h1>
  <p>TRN Training Center</p>
</header>
<main class="container">
  <h2 class="section-title">HHA Exchange+ Training</h2>
  <article class="card">
    <div class="video-wrap">
      <iframe
        src="https://www.youtube-nocookie.com/embed/m6KVVV13pCA?playsinline=1"
        title="How to select the duties in a visit using HHA Exchange+ | ENGLISH"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>
    <div class="card-body">
      <span class="badge">LESSON 1</span>
      <h2>How to select the duties in a visit using HHA Exchange+ | ENGLISH</h2>
    </div>
  </article>
</main>
<footer class="footer">Affinity Home Care • TRN Training Center</footer>
</body>
</html>
